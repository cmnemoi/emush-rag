name: emush-rag

services:
  app:
    image: ghcr.io/cmnemoi/emush-rag/api:${IMAGE_TAG:-latest}
    container_name: emush-rag-api
    expose: ["8080"]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VECTOR_STORE_URL=vector_store
      - VECTOR_STORE_PORT=9200
    depends_on:
      - vector_store
      - jaeger
    networks:
      - emush_rag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  vector_store:
    image: opensearchproject/opensearch:3.8.0
    container_name: emush-rag-vector-store
    environment:
      - discovery.type=single-node
      # Only reachable from the Compose network and the server loopback: no need for TLS and users.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    # Published on the server loopback only, for `make index-documents` to reach it through an SSH tunnel.
    ports:
      - "127.0.0.1::9200"
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    networks:
      - emush_rag

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - emush_rag
    restart: unless-stopped

  grafana:
    image: ghcr.io/cmnemoi/emush-rag/grafana:${IMAGE_TAG:-latest}
    container_name: emush-rag-grafana
    expose: ["3000"]
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      - jaeger
    networks:
      - emush_rag
    restart: unless-stopped

networks:
  emush_rag:
    driver: bridge
volumes:
  grafana-data:
  opensearch-data:
