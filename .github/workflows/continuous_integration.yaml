name: Continous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "*.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          cache-dependency-glob: "uv.lock"
          enable-cache: true
          version: "0.5.1"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --locked --no-group dev --group lint
      - name: Check code format with Ruff
        run: make check-format
      - name: Lint code with Ruff
        run: make check-lint
      - name: Check types with Mypy
        run: make check-types
  
  test:
    name: Tests
    runs-on: ubuntu-22.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          cache-dependency-glob: "uv.lock"
          enable-cache: true
          version: "0.5.1"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --locked --no-group dev --group test
      - name: Run tests with pytest
        run: make test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}